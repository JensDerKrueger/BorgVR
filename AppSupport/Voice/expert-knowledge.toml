version = 1

[dataset.first_inspection]
situation = "A volume has just been opened, or the user asks for an initial overview."
goal = "Identify and describe the newly opened dataset without changing its presentation."
contexts = ["dataset_ready"]
keywords = ["What dataset have I just opened?", "What dataset am I viewing?", "initial inspection", "metadata", "channel type"]
requires_tools = ["get_application_state"]
steps = [
  "Read the dataset description, channel type, physical extent, and current view. State what is known and what is unknown.",
  "If visual evidence is useful and image sharing is available, inspect an overview of the whole volume.",
  "Keep the current transfer function and clipping until the user asks for a different view or there is a specific visual goal.",
]

[dataset.catalog_search]
goal = "What datasets are available? Do we have any datasets about the topic or body part that the user named?"
contexts = ["start_menu", "dataset_ready"]
keywords = ["Search the available volumes in the catalog."]
requires_tools = ["search_datasets"]
steps = [
  "Search descriptions and metadata using the topic and useful synonyms.",
  "Distinguish matching metadata from verified volume contents. Do not open a result unless the user asks to open it.",
]

[inspection.interior]
situation = "The object has an exterior hiding the contents."
goal = "Show the inside of a volume, reveal its contents, or make a cross-section without deleting voxels."
contexts = ["dataset_ready"]
keywords = ["inside", "interior", "cutaway", "cross-section", "seeds inside a fruit", "hidden contents"]
requires_tools = ["set_clipping", "capture_screenshot"]
steps = [
  "Take an overview to locate the object. Choose a clipping plane that reveals the hidden interior from the current view.",
  "Change one clipping boundary at a time. Inspect the result and rotate the view if the section is edge-on.",
  "Use a reversible view change for inspection. Do not erase voxels just to make something visible.",
]

[inspection.preview]
goal = "Get a fast, small overview screenshot before asking for a detailed image."
contexts = ["dataset_ready"]
keywords = ["preview screenshot", "thumbnail", "image resolution", "100 pixels", "faster image"]
requires_parameters = { capture_screenshot = ["max_width"] }
steps = [
  "Use a small width for framing or gross structure, not for identifying tiny features.",
  "Request a larger image or a closer view before precise picking if the feature boundary is unclear.",
]

[rendering.natural_lighting]
situation = "The user wants a more realistic view or clearer structures, or is evaluating a transfer function."
goal = "Use lighting as a visual comparison to judge realism and how clearly structures are shown."
contexts = ["dataset_ready"]
keywords = ["realistic appearance", "natural shading", "lighting", "structural detail", "independent color and opacity"]
requires_parameters = { set_render_mode = ["mode"] }
steps = [
  "Lighting can make an object look more realistic and make surfaces, depth, and structural details easier to see. It is useful for inspecting structures as well as for improving appearance.",
  "Include a lit preview when evaluating a transfer function, especially when RGB and alpha curves vary independently rather than following the same shape. Use set_render_mode to compare transfer_function and transfer_function_lighting with the same transfer function, view, and clipping.",
  "If image sharing is available, wait for each view to render before comparing previews. Choose the mode that best serves the goal, respect an explicitly requested mode, and do not claim to have verified a visual improvement without a preview.",
]

[transfer_function.component]
situation = "The user wants a new appearance or a change to the color or opacity of a scalar volume."
goal = "Build or adjust a transfer function with sparse control points instead of generating a full RGBA table."
contexts = ["dataset_ready"]
keywords = ["transfer function", "realistic colors", "opacity window", "color ramp", "control points"]
requires_tools = ["set_transfer_function_component"]
steps = [
  "Use set_transfer_function_component once per affected component, even when all four components need to change. Component 3 is opacity. Preserve components that the task does not require changing.",
  "Start with a few normalized [position, value] pairs at meaningful changes in slope; do not sample every position. Both coordinates are in [0,1]. Positions must strictly increase.",
  "BorgVR interpolates linearly and extends the endpoint values. For an opacity window, add explicit zero-valued points outside the visible range.",
  "Consider set_transfer_function only if the intended edit really needs more than about 50 control points across the affected components and fewer points cannot adequately represent it. This is a guideline, not a tool limit. A new overall appearance is not a reason to send a full RGBA table.",
]

[transfer_function.noise]
situation = "A volume rendering should look clear or realistic, or the user asks to reduce speckle, grain, or obscuring background."
goal = "Suppress visual noise without hiding useful fine structure. Noise is not a desirable effect in a normal presentation."
contexts = ["dataset_ready"]
keywords = ["noise", "speckle", "grain", "background artifacts", "denoise", "realistic transfer function"]
requires_tools = ["set_transfer_function_component"]
steps = [
  "Do not assume that noise belongs to a particular intensity range. Use the current channel's sweep evidence, if available, and check the representative previews to distinguish incoherent speckle or background from real fine detail. A noise score is a hint, not proof.",
  "For a noise-dominated interval that does not contain structures needed for the task, keep opacity (component 3) at zero throughout that interval with explicit control points. Preserve adjacent useful ranges and the existing colors if the user only asked to reduce noise.",
  "Apply the supported opacity changes together, then inspect one rendered view. Make at most one targeted follow-up adjustment, and only if you can identify a specific interval and evidence for changing it. If noise overlaps the wanted structures or the evidence is inconclusive, explain that limit instead of repeatedly changing the curve.",
]

[spatial.rotation_geometry]
situation = "The user asks to rotate or tilt the displayed volume, or gives an axis and angle."
goal = "Choose a signed rotation in the correct reference frame and preserve the other view settings."
contexts = ["dataset_ready"]
keywords = ["rotate", "turn", "tilt", "yaw", "pitch", "roll", "axis", "degrees"]
requires_parameters = { rotate_view = ["axis", "degrees"] }
steps = [
  "rotate_view turns the object, not the camera. It applies a relative axis-angle rotation in fixed parent coordinates: next orientation = delta * current orientation. An angle is a delta from the current pose, not a target pose. Multiple rotations about different axes do not commute.",
  "Use the right-hand rule for positive angles: +90 degrees about Y turns +Z toward +X; +90 about X turns +Z toward -Y; +90 about Z turns +X toward +Y. A negative angle reverses the direction. Use [1,0,0], [0,1,0], or [0,0,1] for the fixed axes.",
  "On macOS and iOS, fixed +X is screen right, +Y is up, and +Z points toward the viewer. Y is horizontal turning, X is tilting up or down, and positive Z is counterclockwise in the image. On visionOS the rotation axes are in the scene or anchor frame, not relative to the viewer's head; do not assume the same screen directions.",
  "If the user specifies a fixed axis and angle, execute one rotate_view with that delta; no visual search is needed. For a dataset-local axis, first read transform.rotation and map that local direction through the current quaternion [x,y,z,w] into the parent frame. Keep translation, scale, clipping and appearance unchanged unless requested.",
]

[spatial.target_orientation]
situation = "The user asks for a view direction or recognizable pose rather than a numeric rotation, for example a front view, side profile, or a face pointing toward one side of the image."
goal = "Reach a recognizable target view with a planned rotation, then verify it visually."
contexts = ["dataset_ready"]
keywords = ["front view", "side profile", "face left", "face right", "look from above", "anatomical view", "upright", "back view"]
requires_tools = ["get_application_state"]
requires_parameters = { rotate_view = ["axis", "degrees"] }
steps = [
  "Establish the current pose first: read application state and, if available, inspect one current screenshot. Use clear landmarks such as the nose and shoulders to estimate facing and up. Dataset axes do not identify patient sides. Distinguish a subject's left or right side from facing left or right in the image; ask one specific question if the requested reference frame or landmarks are unclear.",
  "Choose the smallest signed turn from the observed pose toward the target. For an upright face looking at the camera on macOS or iOS, about +90 degrees around Y makes the nose point screen right, and -90 makes it point screen left; about 45 gives a three-quarter view. If it is already turned, apply only the remaining angle. Do not use roll to change a profile or assume that yaw alone is enough for a tilted or sideways subject.",
  "For a view-relative target on visionOS, use the actual viewing direction only if you can establish it in the scene frame. If you cannot relate the view to the fixed rotation axes, ask for a known starting view or an explicit axis instead of trying signs at random.",
  "After one planned turn, wait for the new frame when that tool is available and verify the same landmarks in a new screenshot. Make at most one targeted correction from the observed remaining error. If the target is already met, stop; if you cannot verify it or still cannot tell which rotation would help, say what remains uncertain and ask for clarification instead of trying more rotations.",
]

[spatial.picking]
goal = "Locate a visible landmark in dataset-local 3D coordinates for a marker, measurement, or edit."
contexts = ["dataset_ready"]
keywords = ["pick a 3D point", "landmark position", "pixel", "depth", "3D coordinates"]
requires_tools = ["capture_screenshot", "pick_screenshot_positions"]
steps = [
  "Use a current screenshot with enough detail to recognize the landmark. Select points inside the visible feature, not along a blurred outline.",
  "Use the screenshot's own ID for picking. A hit identifies the visible point on that ray, not the hidden extent of the feature.",
]
