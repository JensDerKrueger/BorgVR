name: BorgVR model endpoint

on:
  pull_request:
    paths: ['BorgVRAgentServer/**', 'AppSupport/Voice/**', '.github/workflows/borgvr-model.yml']
  push:
    paths: ['BorgVRAgentServer/**', 'AppSupport/Voice/**', '.github/workflows/borgvr-model.yml']

permissions:
  contents: read

jobs:
  deployment-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BorgVRAgentServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: BorgVRAgentServer/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: ./setup.sh init
      - run: docker compose config --quiet
      - run: docker compose run --rm --no-deps --entrypoint nginx model-gateway -t -c /etc/nginx/borgvr.conf
