worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 64; }

http {
  access_log off;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 7m;
  proxy_read_timeout 200s;
  proxy_http_version 1.1;
  server_tokens off;

  server {
    listen 8766 ssl;
    ssl_certificate /run/tls/server.crt;
    ssl_certificate_key /run/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Use Docker DNS on each new upstream resolution so a model restart can change its IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $model http://vllm:8000;
    proxy_pass_request_headers off;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $content_type;

    location = /v1/models {
      if ($request_method != GET) { return 405; }
      proxy_pass $model/v1/models;
    }
    location = /v1/chat/completions {
      if ($request_method != POST) { return 405; }
      proxy_pass $model/v1/chat/completions;
    }
    location / { return 404; }
  }
}
