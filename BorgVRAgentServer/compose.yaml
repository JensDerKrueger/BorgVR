name: borgvr-ai
x-model-environment: &model-environment
  BORGVR_MODEL: ${BORGVR_MODEL}
  BORGVR_MODEL_REVISION: ${BORGVR_MODEL_REVISION}
  BORGVR_TOOL_PARSER: ${BORGVR_TOOL_PARSER:-qwen3_coder}
  BORGVR_REASONING_PARSER: ${BORGVR_REASONING_PARSER:-qwen3}
  BORGVR_THINKING_MODE: ${BORGVR_THINKING_MODE:-off}
  BORGVR_VISION_ENABLED: ${BORGVR_VISION_ENABLED:-true}
  BORGVR_CONTEXT_LENGTH: ${BORGVR_CONTEXT_LENGTH}
  BORGVR_GPU_MEMORY_FRACTION: ${BORGVR_GPU_MEMORY_FRACTION}
  BORGVR_DTYPE: ${BORGVR_DTYPE:-auto}
  BORGVR_QUANTIZATION: ${BORGVR_QUANTIZATION:-auto}
  BORGVR_MAX_SEQS: ${BORGVR_MAX_SEQS:-2}
  BORGVR_MAX_OUTPUT_TOKENS: ${BORGVR_MAX_OUTPUT_TOKENS:-2048}
  BORGVR_MIN_FREE_GIB: ${BORGVR_MIN_FREE_GIB:-200}
  BORGVR_ENFORCE_EAGER: ${BORGVR_ENFORCE_EAGER:-false}
  BORGVR_CPU_OFFLOAD_GB: ${BORGVR_CPU_OFFLOAD_GB:-0}
services:
  vllm:
    image: ${BORGVR_VLLM_IMAGE:?Run setup.sh first}
    restart: unless-stopped
    group_add: ["${BORGVR_GID}"]
    entrypoint: ["python3", "/opt/borgvr/vllm_start.py"]
    environment:
      <<: *model-environment
      HF_HOME: /cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - model-cache:/cache
      - ./vllm_start.py:/opt/borgvr/vllm_start.py:ro
      - ./model_config.py:/opt/borgvr/model_config.py:ro
    secrets: [vllm_token]
    shm_size: 16gb
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 6s
      retries: 6
      start_period: 30m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  agent:
    image: ${BORGVR_AGENT_IMAGE:-borgvr-agent:3.9}
    restart: unless-stopped
    user: "${BORGVR_UID}:${BORGVR_GID}"
    depends_on:
      vllm: {condition: service_healthy}
    ports:
      - "${BORGVR_BIND_ADDRESS}:${BORGVR_PORT}:8766"
    environment:
      <<: *model-environment
      BORGVR_VLLM_URL: http://vllm:8000/v1
      BORGVR_TOKEN_FILE: /run/secrets/agent_token
      BORGVR_VLLM_TOKEN_FILE: /run/secrets/vllm_token
    secrets: [agent_token, vllm_token]
    volumes:
      - ./runtime/tls:/run/tls:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "client.py", "--url", "https://127.0.0.1:8766", "--ca", "/run/tls/server.crt", "--token-file", "/run/secrets/agent_token", "--health"]
      interval: 30s
      timeout: 12s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  model-cache:
secrets:
  agent_token: {file: ./runtime/secrets/agent_token}
  vllm_token: {file: ./runtime/secrets/vllm_token}
