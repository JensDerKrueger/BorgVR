# Explicit all-GPU access for multi-GPU inference or NVIDIA's WSL container interface.
# Model sharding is controlled separately by BORGVR_TENSOR_PARALLEL_SIZE.
# Use instead of compose.cuda.yaml, never on top of it.
services:
  vllm:
    group_add: ["${BORGVR_GID}"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
